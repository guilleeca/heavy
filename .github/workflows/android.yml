# Heavy · app de Android (APK)
# Compila el APK firmado y lo publica en Releases → "android" → heavy.apk.
# Se lanza sola cuando cambia algo nativo (android/, capacitor.config.ts o los
# paquetes) y también a mano: Actions → "App de Android" → Run workflow.
#
# Secretos (Settings → Secrets and variables → Actions):
#   HEAVY_KEYSTORE_PASSWORD  contraseña larga inventada por ti (firma del APK)
#   GOOGLE_SERVICES_JSON     contenido del archivo google-services.json de Firebase
#
# La primera vez crea la firma (android/heavy-release.p12, protegida con esa
# contraseña) y la guarda en el repo: así todos los APK llevan la misma firma
# y Android deja instalarlos encima sin perder nada.

name: App de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          PASS: ${{ secrets.HEAVY_KEYSTORE_PASSWORD }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$PASS" ]; then echo "::error::Falta el secreto HEAVY_KEYSTORE_PASSWORD"; exit 1; fi
          if [ ${#PASS} -lt 12 ]; then echo "::error::HEAVY_KEYSTORE_PASSWORD debe tener al menos 12 caracteres"; exit 1; fi
          if [ -z "$GS" ]; then echo "::error::Falta el secreto GOOGLE_SERVICES_JSON (archivo de Firebase)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web y plugins
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Archivo de Firebase
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GS" > android/app/google-services.json

      - name: Firma del APK (se crea la primera vez)
        env:
          PASS: ${{ secrets.HEAVY_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f android/heavy-release.p12 ]; then
            keytool -genkeypair -v -storetype PKCS12 -keystore android/heavy-release.p12 \
              -alias heavy -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Heavy, O=Heavy, C=ES"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/heavy-release.p12
            git commit -m "Firma del APK de Android [skip ci]"
            git push
          fi

      - name: Compilar APK
        env:
          HEAVY_KEYSTORE: ${{ github.workspace }}/android/heavy-release.p12
          HEAVY_KEYSTORE_PASSWORD: ${{ secrets.HEAVY_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../heavy.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Versión 1.0.${{ github.run_number }} · $(date -u +'%d/%m/%Y %H:%M') UTC. Descarga heavy.apk desde el móvil e instálalo encima de la anterior."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android heavy.apk --clobber
            gh release edit android --notes "$NOTES"
          else
            gh release create android heavy.apk --title "Heavy para Android" --notes "$NOTES" --latest=false
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: heavy-apk
          path: heavy.apk
          retention-days: 7
